name: flashpoint

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: flashpoint
      POSTGRES_USER: flashpoint
      POSTGRES_PASSWORD: flashpoint_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashpoint -d flashpoint"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
